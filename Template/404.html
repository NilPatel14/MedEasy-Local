{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found | MedEasy</title>
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 48px 32px;
      max-width: 560px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #1977CA;
      letter-spacing: 1px;
      margin-bottom: 40px;
      display: block;
      text-decoration: none;
    }

    .error-code {
      font-size: 120px;
      font-weight: 800;
      color: #1977CA;
      line-height: 1;
      letter-spacing: -4px;
    }

    .cross {
      display: inline-block;
      width: 90px;
      height: 90px;
      position: relative;
      margin: 0 12px;
      vertical-align: middle;
    }

    .cross::before,
    .cross::after {
      content: '';
      position: absolute;
      background: #e74c3c;
      border-radius: 4px;
    }

    .cross::before {
      width: 14px;
      height: 90px;
      left: 50%;
      transform: translateX(-50%);
    }

    .cross::after {
      width: 90px;
      height: 14px;
      top: 50%;
      transform: translateY(-50%);
    }

    .illustration {
      margin: 32px auto;
      width: 160px;
      height: 160px;
    }

    .illustration svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: 26px;
      color: #2c3e50;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      color: #7f8c8d;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-block;
    }

    .btn-primary {
      background: #1977CA;
      color: #fff;
      border: 2px solid #1977CA;
    }

    .btn-primary:hover {
      background: #1258a0;
      border-color: #1258a0;
    }

    .btn-secondary {
      background: #fff;
      color: #1977CA;
      border: 2px solid #1977CA;
    }

    .btn-secondary:hover {
      background: #f0f4f8;
    }

    .divider {
      margin: 40px auto;
      width: 60px;
      height: 3px;
      background: #1977CA;
      border-radius: 2px;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <div class="container">

    <a class="logo" href="/">MedEasy</a>

    <!-- Hospital + 404 illustration -->
    <div class="illustration">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Building -->
        <rect x="40" y="80" width="120" height="110" rx="4" fill="#dce8f5" stroke="#1977CA" stroke-width="3"/>
        <!-- Roof -->
        <polygon points="30,80 100,30 170,80" fill="#1977CA"/>
        <!-- Cross on roof -->
        <rect x="90" y="42" width="20" height="28" rx="3" fill="#fff"/>
        <rect x="82" y="50" width="36" height="12" rx="3" fill="#fff"/>
        <!-- Door -->
        <rect x="78" y="148" width="44" height="42" rx="3" fill="#1977CA"/>
        <!-- Windows -->
        <rect x="52" y="100" width="30" height="28" rx="3" fill="#fff" stroke="#1977CA" stroke-width="2"/>
        <rect x="118" y="100" width="30" height="28" rx="3" fill="#fff" stroke="#1977CA" stroke-width="2"/>
        <!-- Window cross lines -->
        <line x1="67" y1="100" x2="67" y2="128" stroke="#1977CA" stroke-width="1.5"/>
        <line x1="52" y1="114" x2="82" y2="114" stroke="#1977CA" stroke-width="1.5"/>
        <line x1="133" y1="100" x2="133" y2="128" stroke="#1977CA" stroke-width="1.5"/>
        <line x1="118" y1="114" x2="148" y2="114" stroke="#1977CA" stroke-width="1.5"/>
        <!-- Question mark -->
        <text x="148" y="50" font-size="52" font-weight="900" fill="#e74c3c" font-family="Arial">?</text>
      </svg>
    </div>

    <div style="font-size:72px; font-weight:800; color:#1977CA; line-height:1; margin-bottom:8px;">404</div>

    <div class="divider"></div>

    <h1>Page Not Found</h1>
    <p>
      Oops! The page you are looking for doesn't exist or has been moved.<br>
      Please check the URL or go back to the homepage.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">Go to Home</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
    </div>

  </div>
</body>
</html>
